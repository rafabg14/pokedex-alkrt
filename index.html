<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex Taxonômica</title>
<style>
:root{--red:#c8202f;--red2:#8f1420;--screen:#d8e8d0;--ink:#1d2a1f;--bg:#2a2d34;--card:#f4f6ef;--line:#9fb59a;--accent:#2b7fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--screen:#1f2d22;--ink:#d6efd0;--card:#26372a;--line:#3f5a45;--bg:#15171b}}
:root[data-theme="dark"]{--screen:#1f2d22;--ink:#d6efd0;--card:#26372a;--line:#3f5a45;--bg:#15171b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink)}
header{background:linear-gradient(var(--red),var(--red2));padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:6px solid #5e0b14}
.lens{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe9ff,#2b7fff 55%,#0b3a85);border:4px solid #fff;flex:none}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid #0004}
.dots i:nth-child(1){background:#ff5a5a}.dots i:nth-child(2){background:#ffd84a}.dots i:nth-child(3){background:#5adf7a}
h1{margin:0;font-size:1.3rem;color:#fff;letter-spacing:.5px}
header p{margin:0;color:#ffd9dc;font-size:.82rem}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:8px}
@media(max-width:800px){nav{flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.tab{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);flex:none}
@media(max-width:800px){.tab{width:200px}}
.tab b{display:block;font-style:italic;font-size:.95rem}.tab small{opacity:.75}
.tab:focus-visible{outline:3px solid var(--accent)}
.tab[aria-selected=true]{background:var(--red);color:#fff;border-color:#fff}
.screen{background:var(--screen);border:6px solid #e9e9e9;border-radius:16px 16px 40px 16px;padding:18px;box-shadow:inset 0 0 0 3px #0003}
.gname{font-size:1.6rem;font-style:italic;margin:0}
.gdesc{margin:4px 0 10px;font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mon{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;color:var(--ink)}
.mon:hover{border-color:var(--red)}.mon:focus-visible{outline:3px solid var(--accent)}
.ph{width:100%;aspect-ratio:1;background:#fff;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;margin-bottom:6px;padding:6px}
.ph img{max-width:100%;max-height:100%;object-fit:contain}
.num{font-size:.78rem;opacity:.7}.nm{font-weight:700;font-size:1.05rem}
.types{display:flex;gap:4px;justify-content:center;margin-top:4px;flex-wrap:wrap}
.t{font-size:.72rem;color:#fff;padding:1px 8px;border-radius:99px;text-shadow:0 1px 1px #0006}
.rep{display:inline-block;margin-top:5px;font-size:.7rem;background:#e0a800;color:#2b2200;border-radius:6px;padding:1px 6px}
dialog{border:6px solid #e9e9e9;border-radius:16px;background:var(--screen);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:#000a}
dialog h2{margin:0;font-size:1.6rem}dialog p{margin:6px 0}
.x{all:unset;cursor:pointer;float:right;background:var(--red);color:#fff;border-radius:8px;padding:4px 12px}
.gl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.gl button{all:unset;cursor:pointer;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 10px}
.gl button:focus-visible{outline:3px solid var(--accent)}
#ov{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
#ov i{position:absolute;left:0;right:0;height:50%;transition:transform .5s cubic-bezier(.7,0,.3,1)}
#ov .a{top:0;background:linear-gradient(var(--red),var(--red2));border-bottom:6px solid #5e0b14;transform:translateY(-101%)}
#ov .b{bottom:0;background:linear-gradient(var(--red2),#5e0b14);border-top:6px solid #5e0b14;transform:translateY(101%)}
#ov.shut{pointer-events:auto}#ov.shut i{transform:none}
#ov b{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 35% 30%,#bfe9ff,#2b7fff 55%,#0b3a85);z-index:2;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s}
#ov.shut b{opacity:1;transform:scale(1)}
@media(prefers-reduced-motion:reduce){#ov{display:none}}
[hidden]{display:none!important}
.brand{margin-left:auto;background:#fff;border-radius:10px;padding:5px 9px;display:flex}.brand svg{height:40px;width:auto}
.top{display:flex;gap:8px;max-width:1100px;margin:14px auto 0;padding:0 16px}
.top button{all:unset;cursor:pointer;padding:9px 18px;border-radius:99px;background:var(--card);border:2px solid var(--line);color:var(--ink);font-weight:700}
.top button[aria-selected=true]{background:var(--red);color:#fff;border-color:#fff}.top button:focus-visible{outline:3px solid var(--accent)}
.proc{max-width:1100px;margin:0 auto;padding:16px}.proc h3{margin:18px 0 6px;font-style:italic}
.steps{padding-left:22px;margin:8px 0}.steps li{margin:6px 0;font-size:1.02rem}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pairs figure{margin:0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#fff}.pp img.c{object-fit:contain;padding:4px}
.pairs figcaption{text-align:center;font-weight:700;margin-top:6px}
.team{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px}
.team .logo{background:#fff;border-radius:10px;padding:8px}.team .logo svg{height:64px;width:auto;display:block}.team ul{margin:0;padding-left:18px}
.mon{transition:transform .15s}.mon:hover{transform:translateY(-3px)}.mon.pop{animation:pp .22s}
@keyframes pp{50%{transform:scale(.88)}}
dialog[open]{animation:dz .45s cubic-bezier(.2,.9,.3,1.25)}
@keyframes dz{from{transform:scale(.4) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
dialog .ph{position:relative;overflow:hidden;max-width:260px;margin:0 auto 6px}
dialog .ph::after{content:"";position:absolute;left:0;right:0;height:14px;top:-14px;background:linear-gradient(transparent,#4dff8a,transparent);box-shadow:0 0 14px 4px #4dff8a99;animation:sc .8s ease-in-out 2 alternate both}
@keyframes rv{0%,50%{filter:brightness(0);transform:scale(.85)}70%{filter:brightness(2) saturate(0);transform:scale(1.04)}100%{filter:none;transform:none}}
@keyframes sc{from{top:-14px}to{top:100%}}
dialog h2,dialog .types{animation:fi .4s .8s both}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){dialog,dialog *,.mon{animation:none!important}}
footer{text-align:center;color:#aaa;font-size:.8rem;padding:10px 16px 24px}
</style>
</head>

<div><h1>Pokédex Taxonômica</h1><p>10 grupos · 28 pokémons · nomes científicos latinizados</p></div><div class="brand" id="hl" aria-label="IFBA"></div></header>
<div class="top" role="tablist"><button role="tab" data-v="dex" aria-selected="true">Pokémons</button><button role="tab" data-v="proc" aria-selected="false">Processo criativo</button></div>
<main id="dex">
<nav id="nav" role="tablist" aria-label="Grupos"></nav>

<section class="proc" id="proc" hidden></section>
<div id="ov" class="shut" aria-hidden="true"><i class="a"></i><i class="b"></i><b></b></div>
<dialog id="dlg"></dialog>

const G=[
["Ungulata quadrupeda","Quatro membros locomotores terminados em casco. São animais de porte médio a grande, que se apoiam sobre a ponta dos dedos protegida por uma unha endurecida, com corpo adaptado à corrida e à marcha firme.",["Camerupt","Tauros","Ponyta"],""],
["Testata dorsalis","Estrutura rígida externa cobrindo o dorso, como carapaça, concha ou casca. Funciona como proteção para o corpo mais vulnerável por baixo e define a silhueta do animal.",["Omanyte","Kabuto","Krabby","Parasect"],""],
["Informa gasosa","Corpo amorfo ou gasoso, sem contorno fixo. Os indivíduos podem mudar de forma, ficar envoltos em nuvem de gás ou ter aparência difusa, sem partes bem delimitadas.",["Ditto","Gastly","Weezing"],""],
["Polysoma apoda","Sem pernas visíveis, com corpo repetido ou múltiplo. O organismo é formado por várias unidades semelhantes, como cabeças ou corpos, que se deslocam sem membros locomotores evidentes.",["Dugtrio","Weezing","Magneton"],""],
["Folia bipeda","Bípedes com folhagem ou ramos no corpo. Andam sobre duas pernas e carregam folhas, palmas ou ramificações vegetais, o que lhes dá aparência de planta ambulante.",["Exeggutor","Gloom","Tangela"],""],
["Larvata picta","Marca de rosto ou caveira pintada no corpo. Apresentam um padrão de cor que lembra uma face, máscara ou crânio, geralmente no dorso ou na cabeça, e que pode funcionar como sinal visual de aviso.",["Weezing","Arbok","Spinarak"],""],
["Monocerata frontalis","Um único chifre central na testa. A projeção é pontiaguda e fica no meio da fronte, o que a distingue de chifres em par ou de antenas.",["Nidorino","Seaking","Spinarak","Onix"],""],
["Phytosoma integrata","Tecido vegetal ou lenhoso integrado ao corpo. Bulbo, copa de folhas ou tronco fazem parte do próprio organismo, e não são apenas acessórios.",["Bulbasaur","Exeggutor","Sudowoodo"],""],
["Sine oculis gigantum","Pokémons gigantes, cegos ou com baixa visão. Evitam aparecer, vivem em áreas escuras e raramente são vistos, o que os torna muito difíceis de observar.",["Opistho","Brafilius","Toupocampus"],""],
["Mutans polyophthalmus","Pokémons com mais de dois olhos e sentidos visuais extraordinários. Aquaveu percebe movimentos e contrastes sutis na água, mesmo no escuro; Lunélis enxerga no ultravioleta; Rubriptera distingue mais de 100 cores invisíveis a olho nu. São extremamente difíceis de capturar: percebem a aproximação e fogem em grande velocidade.",["Aquaveu","Lunélis","Rubriptera"],""]];
const AUT=new Set(["Opistho","Brafilius","Toupocampus","Aquaveu","Lunélis","Rubriptera"]);
const ABOUT={Aquaveu:"Percebe movimentos e contrastes sutis na água, mesmo em meio à escuridão.",Lunélis:"Possui visão ultravioleta, enxergando padrões e cores invisíveis aos humanos.",Rubriptera:"Distingue mais de 100 cores impossíveis de perceber a olho nu."};
const num=n=>AUT.has(n)?"Inédito":"#"+String(PT[n][0]).padStart(3,"0");
const $=s=>document.querySelector(s);
const inGroups=n=>G.map((g,i)=>g[2].includes(n)?i:-1).filter(i=>i>=0);
let cur=0;
function ball(n){return `<div class="ph"><img src="${IMG[n]}" alt="${n}"></div>`}
function chips(n){if(AUT.has(n))return '<div class="types"><span class="t" style="background:#c8202f">Autoral</span></div>';return `<div class="types">${PT[n].slice(1).map(t=>`<span class="t" style="background:${TC[t]}">${t}</span>`).join("")}</div>`}
function nav(){$("#nav").innerHTML=G.map((g,i)=>`<button class="tab" role="tab" aria-selected="${i==cur}" data-i="${i}"><b>${i+1}. ${g[0]}</b><small>${g[2].length} pokémons</small></button>`).join("");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function render(){nav();const g=G[cur];
$("#screen").innerHTML=`<h2 class="gname">${g[0]}</h2><p class="gdesc"><strong>Característica:</strong> ${g[1]}.</p>
<div class="grid">${g[2].map(n=>`<button class="mon" data-n="${n}">${ball(n)}<div class="num">${num(n)}</div><div class="nm">${n}</div>${chips(n)}</button>`).join("")}</div>`;
document.querySelectorAll(".mon").forEach(b=>b.onclick=()=>{b.classList.add("pop");setTimeout(()=>{b.classList.remove("pop");open(b.dataset.n)},220)})}
function open(n){const gs=inGroups(n);const d=$("#dlg");
d.innerHTML=`<button class="x" onclick="dlg.close()">Fechar</button>${ball(n)}<p class="num">${num(n)}</p><h2>${n}</h2>${chips(n)}
${ABOUT[n]?`<p>${ABOUT[n]}</p>`:""}<p><strong>Grupo${gs.length>1?"s":""}:</strong></p><div class="gl">${gs.map(i=>`<button data-i="${i}"><b>${i+1}. ${G[i][0]}</b><br><small>${G[i][1]}</small></button>`).join("")}</div>`;
d.querySelectorAll(".gl button").forEach(b=>b.onclick=()=>{d.close();go(+b.dataset.i);scrollTo(0,0)});
d.showModal()}
const LOGO='<svg viewBox="0 0 282 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Instituto Federal da Bahia"><g fill="#6ebd2e"><rect x="21" y="2" width="17" height="17" rx="4"/><rect x="40" y="2" width="17" height="17" rx="4"/><rect x="2" y="21" width="17" height="17" rx="4"/><rect x="21" y="21" width="17" height="17" rx="4"/><rect x="2" y="40" width="17" height="17" rx="4"/><rect x="21" y="40" width="17" height="17" rx="4"/><rect x="40" y="40" width="17" height="17" rx="4"/><rect x="2" y="59" width="17" height="17" rx="4"/><rect x="21" y="59" width="17" height="17" rx="4"/></g><circle cx="10.5" cy="10.5" r="9" fill="#e2231a"/><g font-family="Arial Narrow,Arial,sans-serif" font-weight="700" font-size="12.5" fill="#222f4a"><text x="64" y="52" textLength="150" lengthAdjust="spacingAndGlyphs">INSTITUTO FEDERAL DE</text><text x="64" y="66" textLength="214" lengthAdjust="spacingAndGlyphs">EDUCAÇÃO, CIÊNCIA E TECNOLOGIA</text><text x="64" y="79" fill="#7d93ad" font-size="11">BAHIA</text></g></svg>';

const ov=$("#ov");let busy=false,view="dex";
function transition(fn){if(busy)return;busy=true;ov.classList.add("shut");setTimeout(()=>{fn();ov.classList.remove("shut");busy=false},560)}
function setView(v){view=v;$("#dex").hidden=v!=="dex";$("#proc").hidden=v!=="proc";document.querySelectorAll(".top button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));scrollTo(0,0)}
function go(i){if(i===cur&&view==="dex")return;transition(()=>{cur=i;setView("dex");render()})}
document.querySelectorAll(".top button").forEach(b=>b.onclick=()=>{if(view!==b.dataset.v)transition(()=>setView(b.dataset.v))});
const STEPS=["Primeiro, separamos os grupos de Pokémon segundo suas características, utilizando uma planilha.","Posteriormente, fizemos os desenhos dos Pokémon autorais.","Utilizamos a inteligência artificial para colori-los.","Após isso, construímos o site e organizamos os Pokémon em grupos, com suas características."];
$("#proc").innerHTML=`<div class="screen"><h2 class="gname">Processo criativo</h2><ol class="steps">${STEPS.map(s=>`<li>${s}</li>`).join("")}</ol>
<h3>Do rascunho ao Pokémon colorido</h3><p>Desenhamos os Pokémon à mão, em lápis. Cada rascunho aparece ao lado da versão colorida.</p>
<div class="pairs">${["Opistho","Brafilius","Toupocampus","Aquaveu","Lunélis","Rubriptera"].map(n=>`<figure><div class="pp"><img src="${IMG["sk_"+n]}" alt="Rascunho a lápis de ${n}"><img class="c" src="${IMG[n]}" alt="${n} colorido"></div><figcaption>${n}</figcaption></figure>`).join("")}</div>
<h3>Dificuldades encontradas</h3><p>A maior dificuldade foi encontrar características únicas para cada Pokémon e identificar semelhanças entre eles para formar os grupos.</p><p>Também tivemos dificuldades em criar os Pokémon autorais e em escolher nomes criativos que combinassem com suas características.</p><p>Apesar disso, conseguimos concluir o projeto com ideias originais e resultados satisfatórios.</p><h3>Equipe</h3><div class="team"><div class="logo">${LOGO}</div><div><ul><li>Aida Brandão</li><li>Kariny Pinho</li><li>Lorena Bispo</li><li>Rafael Bittencourt</li><li>Thiago Santana</li></ul></div><p>Atividade Lúdico Científica sobre Taxonomia<br>Professora: Silvanir Souza<br>IFBA, Santo Amaro, 2026</p></div></div>`;
render();setTimeout(()=>ov.classList.remove("shut"),600);
</script>
</body>
</html>
